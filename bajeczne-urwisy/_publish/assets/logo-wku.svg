<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="WKU — World Kennel Union">
  <defs>
    <style>
      .txt{font-family:Georgia,'Times New Roman',serif}
      .globe{fill:none;stroke:#fff;stroke-width:2.4}
    </style>
    <path id="wku-top" d="M110 110 m-78,0 a78,78 0 0 1 156,0"/>
    <path id="wku-bot" d="M110 110 m-70,0 a70,70 0 0 0 140,0"/>
  </defs>
  <circle cx="110" cy="110" r="104" fill="#16467a"/>
  <circle cx="110" cy="110" r="104" fill="none" stroke="#0f3050" stroke-width="3"/>
  <circle cx="110" cy="110" r="86" fill="none" stroke="#cdb46a" stroke-width="2"/>
  <!-- globe -->
  <circle cx="110" cy="104" r="40" fill="#1d5793"/>
  <circle class="globe" cx="110" cy="104" r="40"/>
  <ellipse class="globe" cx="110" cy="104" rx="16" ry="40"/>
  <line class="globe" x1="70" y1="104" x2="150" y2="104"/>
  <path class="globe" d="M76 86 q34 -12 68 0"/>
  <path class="globe" d="M76 122 q34 12 68 0"/>
  <path d="M92 92 q10 6 4 16 q-8 6 -2 14 q8 4 4 12" fill="none" stroke="#cdb46a" stroke-width="3" stroke-linecap="round"/>
  <text class="txt" x="110" y="62" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">WKU</text>
  <text class="txt" fill="#cdb46a" font-size="11.5" letter-spacing="2.2" font-weight="700">
    <textPath href="#wku-top" startOffset="50%" text-anchor="middle">WORLD KENNEL UNION</textPath>
  </text>
  <text class="txt" fill="#cdb46a" font-size="11" letter-spacing="3">
    <textPath href="#wku-bot" startOffset="50%" text-anchor="middle">★ MEMBER ★</textPath>
  </text>
</svg>
