<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Sacramento&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FBF7F1; --ink:#2a2722; --brown:#a6714a; --gold:#d3a735;
    --muted:#8a8178; --line:#ece3d6;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1080px; height:1350px; }
  body{
    background:var(--cream);
    font-family:'Nunito',system-ui,sans-serif;
    color:var(--ink);
    position:relative;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .wm{ position:absolute; right:-70px; top:-50px; width:380px; opacity:.045; transform:rotate(8deg); }
  .frame{ position:absolute; inset:30px; border:1.5px solid var(--line); border-radius:36px; pointer-events:none; }
  .post{ position:relative; height:100%; display:flex; flex-direction:column; align-items:center; padding:74px 86px 60px; }
  .eyebrow{ font-family:'Sacramento',cursive; color:var(--brown); font-size:64px; line-height:1; }
  .kicker{ font-size:17px; letter-spacing:.34em; text-transform:uppercase; color:var(--muted); font-weight:800; margin-top:8px; }
  .photo{ margin-top:34px; width:100%; height:638px; border-radius:28px; overflow:hidden;
    box-shadow:0 28px 58px rgba(42,39,34,.17); background:#efe7da; }
  .photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .stars{ margin-top:42px; color:var(--gold); font-size:46px; letter-spacing:8px; }
  .quote{ margin-top:26px; font-family:'Playfair Display',Georgia,serif; font-style:italic; font-weight:500;
    font-size:56px; line-height:1.25; text-align:center; color:#33302a; max-width:840px; }
  .who{ margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .who .name{ font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:36px; color:var(--ink); }
  .who .role{ font-size:22px; color:var(--muted); font-weight:700; }
  .divider{ margin-top:28px; width:92px; height:3px; background:var(--gold); border-radius:2px; opacity:.85; }
  .brand{ margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:11px; }
  .brand img{ height:52px; width:auto; opacity:.95; }
  .brand .fb{ font-size:18px; color:var(--muted); font-weight:700; }
</style>
</head>
<body>
  <img class="wm" src="../assets/logo-dog-mark.png" alt="" />
  <div class="frame"></div>
  <div class="post">
    <div class="eyebrow">Opinie</div>
    <div class="kicker">Zaufały nam kochające rodziny</div>
    <div class="photo"><img src="../assets/opinie/op-12.webp" alt="Zoja, Chihuahua z hodowli Bajeczne Urwisy" /></div>
    <div class="stars">★★★★★</div>
    <div class="quote">„Nasza ukochana Zoja ❤️”</div>
    <div class="who">
      <div class="name">Małgorzata</div>
      <div class="role">opiekunka Zoi</div>
    </div>
    <div class="divider"></div>
    <div class="brand">
      <img src="../assets/logo-bajeczne-urwisy-clean.png" alt="Bajeczne Urwisy" />
      <div class="fb">facebook.com/BajeczneUrwisy</div>
    </div>
  </div>
</body>
</html>
