<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Arkusz kontrolny ilustracji bazy wiedzy</title>
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: system-ui; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; max-width: 1300px; margin: 0 auto; }
  figure { margin: 0; }
  img { width: 100%; display: block; border-radius: 14px; border: 1px solid #eee; }
  figcaption { font-size: 12px; color: #666; padding: 4px 2px; }
</style>
</head>
<body>
<div class="grid">
  <figure><img src="../assets/wiedza/il-hodowla.svg" alt=""><figcaption>il-hodowla</figcaption></figure>
  <figure><img src="../assets/wiedza/il-chihuahua.svg" alt=""><figcaption>il-chihuahua</figcaption></figure>
  <figure><img src="../assets/wiedza/il-maltanczyk.svg" alt=""><figcaption>il-maltanczyk</figcaption></figure>
  <figure><img src="../assets/wiedza/il-ktora-rasa.svg" alt=""><figcaption>il-ktora-rasa</figcaption></figure>
  <figure><img src="../assets/wiedza/il-wyprawka.svg" alt=""><figcaption>il-wyprawka</figcaption></figure>
  <figure><img src="../assets/wiedza/il-pierwsze-dni.svg" alt=""><figcaption>il-pierwsze-dni</figcaption></figure>
  <figure><img src="../assets/wiedza/il-socjalizacja.svg" alt=""><figcaption>il-socjalizacja</figcaption></figure>
  <figure><img src="../assets/wiedza/il-zywienie.svg" alt=""><figcaption>il-zywienie</figcaption></figure>
  <figure><img src="../assets/wiedza/il-pielegnacja.svg" alt=""><figcaption>il-pielegnacja</figcaption></figure>
  <figure><img src="../assets/wiedza/il-zdrowie.svg" alt=""><figcaption>il-zdrowie</figcaption></figure>
</div>
</body>
</html>
